# Repo-root pytest config.
#
# cli/pyproject.toml already registers the `smoke` marker and deselects it, but
# that config only applies when pytest's rootdir resolves to cli/. Running the
# suite from the repo root - which is how you run skills/tests - picked up
# neither, so a bare `pytest` executed a test that needs a live LinkedIn session
# and reported a failure that has nothing to do with the code under change.
#
# Keep the two settings in sync with cli/pyproject.toml.
[pytest]
markers = smoke: live tests needing a real LinkedIn session (deselected by default)
addopts = -m "not smoke"
